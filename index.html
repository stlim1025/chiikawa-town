  .job-now { grid-template-columns: 40px minmax(0, 1fr) auto; padding: 8px 12px; }
  .sell-box .slots { grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
}

/* 부동산: 쫓겨났을 때 · 집세가 밀렸을 때 경고(주황 테두리) */
.panel .row.evict { flex-wrap: wrap; background: #fde3d6; box-shadow: inset 0 0 0 3px var(--warn); }
.panel .row.evict .t { display: flex; align-items: center; gap: 8px; color: #b8543c; }
.panel .row.evict .t::before, .panel .note.warn::before { content: "!"; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--warn); color: #fff; font-size: 19px; line-height: 1; }
.panel .row.evict > .btn { margin-left: auto; }
.panel .note.warn { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px 10px; border-radius: 16px 18px 16px 14px; background: #fde3d6; color: #a14a32; }

/* 포셰트 가게: 포셰트 그림 + 이름 · 값 + 버튼, 메는 중인 줄은 노랗게 */
.panel-pochette { --tab: var(--pink); }
.panel .row.pochette > div { flex: 1 1 auto; min-width: 0; }
.pochette-art { flex: 0 0 auto; width: 58px; height: 58px; border-radius: 16px 18px 16px 14px; background: var(--paper); box-shadow: 0 2px 0 var(--shadow); }
.pochette-art svg { width: 100%; height: 100%; display: block; }
.panel .row.pochette.worn { background: var(--butter); box-shadow: inset 0 0 0 3px var(--yellow-deep); }
@media (max-width: 480px) {
  /* 좁은 화면: 그림 · 이름은 한 줄, 버튼은 아래 오른쪽으로 */
  .panel .row.pochette { flex-wrap: wrap; }
  .panel .row.pochette > div { flex-basis: calc(100% - 70px); }
  .panel .row.pochette > .btn { margin-left: auto; }
  /* 값 버튼은 짧아서 한 줄에 둔다 */
  .panel .row.pochette:has(> .price-btn), .panel .row.pochette:has(> .lic-badge) { flex-wrap: nowrap; }
  .panel .row.pochette:has(> .price-btn) > div, .panel .row.pochette:has(> .lic-badge) > div { flex-basis: auto; }
  .price-btn { padding-left: 12px; padding-right: 12px; }
}

/* 헌책방 · 도구점 · 지도 앱 · 등불 버튼 */
.panel-books { --tab: var(--mint); }
.panel-tools { --tab: var(--yellow); }
.hud-light[aria-pressed="true"] { background: var(--yellow); }
.app.map .app-ico { background: #7fb6e2; }

/* 풀 도감(마을폰): 급수 머리표 + 풀 칸(그림 · 이름 · 뽑은 수 · 자라는 곳 · 요령). 아직 못 뽑는 급수는 흐리게 */
.app.weeds .app-ico { background: #8cc46d; }
/* 가방 · 옷장: 물건 칸(그림 + 이름 + 개수). 고른 칸은 노랗게 */
.panel-bag, .panel-wardrobe { --tab: #e9b26b; }
.backdrop.side { justify-content: flex-end; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; pointer-events: none; }
.backdrop.side .panel { pointer-events: auto; width: min(400px, 100%); }
.shop-sec { margin: 14px 4px 4px; font-size: 19px; }
.bag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
.bag-tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px 8px; border-radius: 18px; background: var(--paper-2); font-size: 15px; line-height: 1.15; text-align: center; }
.bag-tile[aria-pressed="true"] { background: var(--yellow); box-shadow: 0 3px 0 var(--yellow-deep); }
.bag-tile.static { cursor: default; }
.bag-ico { width: 54px; height: 54px; border-radius: 14px; background: var(--paper); }
.bag-ico svg { width: 100%; height: 100%; display: block; }
.bag-tile .cnt { position: absolute; top: 2px; right: 4px; padding: 0 7px 1px; border-radius: 999px; background: var(--paper); box-shadow: 0 2px 0 var(--shadow); font-size: 14px; font-variant-numeric: tabular-nums; }
.bag-empty { margin: 16px 4px; font-size: 19px; color: var(--ink-soft); text-align: center; }
.panel .row.bag-detail { margin-top: 14px; background: var(--butter); } .app.dev .app-ico { background: #a59bd8; }
/* 테스트 도구(숨은 앱) */
.panel .row.dev-row { flex-wrap: wrap; }
.dev-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.dev-btns .btn { min-height: 38px; padding: 4px 14px 6px; font-size: 17px; }

/* 새 일감 · 시험 쪽지: 가운데에 톡 떴다가 왼쪽 위 일감 칸으로 날아가 꽂힌다(hud.announce) */
.task-card { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%) rotate(-2deg); display: flex; align-items: center; gap: 14px; max-width: min(560px, calc(100% - 40px)); box-sizing: border-box;
  padding: 14px 28px 16px 18px; border-radius: var(--r); background: var(--dots), var(--paper); pointer-events: none; z-index: 6;
  box-shadow: 0 0 0 5px var(--yellow), 0 9px 0 5px var(--yellow-deep), 0 18px 30px rgba(84, 62, 38, 0.25); animation: task-in 0.45s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
@keyframes task-in { from { opacity: 0; transform: translate(-50%, -50%) rotate(-2deg) scale(0.6); } to { opacity: 1; transform: translate(-50%, -50%) rotate(-2deg) scale(1); } }
.task-ico { flex: 0 0 auto; }
.task-ico svg { width: 56px; height: 56px; display: block; }
.task-txt { min-width: 0; }
.task-txt i { display: inline-block; padding: 0 12px 2px; border-radius: 999px; font-style: normal; font-size: 18px; background: var(--mint); box-shadow: 0 2px 0 var(--mint-deep); }
.task-txt b { display: block; margin-top: 4px; font-size: 34px; line-height: 1.1; }
.task-txt span { display: block; margin-top: 2px; font-size: 19px; line-height: 1.25; color: var(--ink-soft); }
@media (max-height: 420px) { .task-txt b { font-size: 26px; } .task-ico svg { width: 44px; height: 44px; } }
/* 쪽지가 꽂힌 일감 칸: 크게 튀었다가 노랗게 반짝 */
.hud-job { transform-origin: left center; }
.hud-job.got { animation: job-got 1.5s ease-out; }
@keyframes job-got {
  0% { scale: 1.22; background: var(--yellow); box-shadow: 0 0 0 7px rgba(252, 217, 91, 0.55), 0 3px 0 var(--yellow-deep); }
  25% { scale: 0.96; } 45% { scale: 1.05; background: var(--yellow); box-shadow: 0 0 0 4px rgba(252, 217, 91, 0.4), 0 3px 0 var(--yellow-deep); }
  100% { scale: 1; }
}
@media (prefers-reduced-motion: reduce) { .task-card, .hud-job.got { animation: none; } }

/* 행동 안내: 지금 누르면 무엇을 하는지 대상 위에 노란 알약(PC 면 키 모양) — 대상 발밑에는 노란 고리(3D) */
.world-label.prompt { display: flex; align-items: center; gap: 7px; padding: 3px 14px 5px; margin-top: -12px; font-size: 18px; line-height: 1.2; color: var(--ink); background: var(--yellow); border-radius: 999px;
  box-shadow: 0 3px 0 var(--yellow-deep), 0 6px 14px rgba(84, 62, 38, 0.2); transform-origin: 50% 100%; animation: prompt-pop 0.22s cubic-bezier(0.2, 1.6, 0.4, 1) both, mark-bob 0.8s ease-in-out 0.22s infinite alternate; }
.world-label.prompt::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -7px; border: 7px solid transparent; border-top: 9px solid var(--yellow-deep); border-bottom: 0; }
.world-label.prompt:has(kbd) { padding-left: 6px; }
.world-label.prompt kbd { padding: 0 7px 1px; border-radius: 7px; font-family: var(--hand); font-size: 14px; line-height: 1.4; color: var(--ink); background: var(--paper); box-shadow: inset 0 -2px 0 var(--paper-3), 0 0 0 1.5px var(--ink-soft); }
@keyframes prompt-pop { from { opacity: 0; scale: 0.5; } to { opacity: 1; scale: 1; } }
@media (prefers-reduced-motion: reduce) { .world-label.prompt { animation: none; } }
/* 친밀도 하트: 친구 머리 위로 퐁퐁(+1), 하트가 늘면 사방으로 터지고 위 가운데 하트 줄 카드 */
.heart-fx { position: absolute; width: 0; height: 0; pointer-events: none; }
.heart-fx .hf { position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; opacity: 0; animation: hf-float 1.1s cubic-bezier(0.2, 0.7, 0.4, 1) var(--t) forwards; }
.heart-fx.up .hf { width: 26px; height: 26px; left: -13px; top: -13px; animation: hf-burst 1.3s cubic-bezier(0.15, 0.8, 0.3, 1) var(--t) forwards; }
.heart-fx .hf svg, .hf-plus svg, .heart-card svg { width: 100%; height: 100%; display: block; }
.hf-plus { position: absolute; left: 0; top: -30px; display: flex; align-items: center; gap: 2px; padding: 1px 10px 3px 6px; transform: translateX(-50%); border-radius: 999px;
  font-size: 18px; color: #c2405f; background: #fff0f4; box-shadow: 0 3px 0 #f3a8bb; white-space: nowrap; animation: hf-plus 1.25s ease-out forwards; }
.hf-plus svg { width: 18px; height: 18px; }
@keyframes hf-float { 0% { opacity: 0; transform: rotate(var(--a)) translateY(0) rotate(calc(-1 * var(--a))) scale(0.4); } 20% { opacity: 1; }
  100% { opacity: 0; transform: rotate(var(--a)) translateY(calc(-1 * var(--d))) rotate(calc(-1 * var(--a))) translateY(-24px) scale(1); } }
@keyframes hf-burst { 0% { opacity: 0; transform: rotate(var(--a)) translateY(0) rotate(calc(-1 * var(--a))) scale(0.3); } 15% { opacity: 1; }
  70% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateY(calc(-1 * var(--d))) rotate(calc(-1 * var(--a))) scale(1.1); } }
@keyframes hf-plus { 0% { opacity: 0; translate: 0 10px; scale: 0.6; } 18% { opacity: 1; translate: 0 0; scale: 1.08; } 30% { scale: 1; } 80% { opacity: 1; } 100% { opacity: 0; translate: 0 -22px; } }
.heart-card { position: absolute; left: 50%; top: max(70px, 14%); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 22px 10px;
  border-radius: var(--r); background: var(--dots), var(--paper); box-shadow: 0 0 0 4px var(--tag), 0 8px 0 4px rgba(84, 62, 38, 0.18), 0 14px 24px rgba(84, 62, 38, 0.2);
  pointer-events: none; z-index: 5; animation: pop 0.35s cubic-bezier(0.2, 1.6, 0.4, 1); transition: opacity 0.4s, translate 0.4s; }
.heart-card.out { opacity: 0; translate: 0 -12px; }
.heart-card b { font-size: 22px; }
.heart-card .row { display: flex; gap: 4px; }
.heart-card .row i { width: 30px; height: 30px; filter: grayscale(1) opacity(0.35); }
.heart-card .row i.on { filter: none; }
.heart-card .row i.new { animation: hc-new 0.7s cubic-bezier(0.2, 1.8, 0.4, 1) 0.3s both; }
@keyframes hc-new { from { scale: 0; filter: grayscale(1) opacity(0.35); } 60% { scale: 1.45; } to { scale: 1; filter: none; } }
.heart-card small { font-size: 16px; color: #c2405f; }
@media (prefers-reduced-motion: reduce) { .heart-fx .hf, .hf-plus, .heart-card .row i.new { animation-duration: 0.01s; } }
/* 집 안: 걸어 다닐 수 있으니 터치에서는 조이스틱과 행동 버튼을 보인다(다른 HUD 는 숨긴 채) */
[data-input="touch"] .cinematic.in-home .hud-action:not([hidden]) { display: block !important; }
.cinematic.in-home .hud-meter:not([hidden]) { display: block !important; } /* 친구 집 수련 게이지 */
.cinematic.in-home .hud-phone { display: block !important; } /* 집 · 친구 집 안에서도 마을폰 */
[data-input="touch"] .cinematic.in-home .stick:not([hidden]) { display: block !important; }
.in-home .home-bar { bottom: max(14px, env(safe-area-inset-bottom)); }
[data-input="touch"] .in-home .home-bar { left: auto; right: 130px; transform: none; width: auto; max-width: calc(100% - 300px); justify-content: flex-end; }
/* PC(키보드 · 마우스): 조이스틱과 행동 버튼 없이 키보드로. 할 수 있는 행동은 위의 안내로 보인다 */
[data-input="desk"] .hud-action, [data-input="desk"] .stick { display: none !important; } .app.licenses .app-ico { background: #f2a7bb; }
.weed-grade { display: flex; align-items: center; gap: 8px; margin: 14px 4px 0; font-size: 19px; }
.weed-grade b { padding: 0 12px 2px; border-radius: 999px; background: var(--mint); box-shadow: 0 2px 0 var(--mint-deep); }
.weed-grade.locked b { background: var(--paper-3); box-shadow: none; color: var(--ink-soft); }
.weed-grade span { font-size: 15px; color: var(--ink-soft); }
.panel .row.weed-card { align-items: flex-start; justify-content: flex-start; gap: 10px; }
.panel .row.weed-card > div { flex: 1 1 auto; min-width: 0; }
.weed-ico { flex: 0 0 auto; width: 56px; height: 56px; border-radius: 16px; background: var(--paper); box-shadow: 0 2px 0 var(--shadow); }
.weed-ico svg { width: 100%; height: 100%; display: block; }
.weed-card .t { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.weed-count { padding: 0 8px 1px; border-radius: 999px; background: var(--butter); color: var(--ink-soft); font-size: 14px; white-space: nowrap; }
.weed-card.unseen .weed-count { background: var(--paper-3); }
.phone .row .d.weed-tip { font-size: 15px; }
.weed-card.locked { opacity: 0.72; }
.weed-card.locked .weed-ico { filter: grayscale(1) opacity(0.6); }

/* ---------- 토벌(4단계): 몬스터 체력 줄 · 알아챔 · 맞음 · 기절 · 떠오르는 글씨 · 안내서 · 도감 ---------- */
.world-label.mhp { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: -6px; font-size: 14px; line-height: 1.1; color: #fff; text-shadow: 0 1px 0 #3a2e2a, 0 0 3px #3a2e2a; }
.world-label.mhp i { display: block; width: 58px; height: 9px; padding: 2px; border-radius: 999px; background: #3a2e2a; box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
.world-label.mhp u { display: block; height: 100%; border-radius: 999px; background: linear-gradient(#ff8f7a, #e8574a); transition: width 0.15s ease-out; }
.world-label.mhp.low u { background: linear-gradient(#ffd27a, #f29a3a); }
.world-label.mhp.boss i { width: 110px; height: 12px; }
.world-label.alert { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; margin-top: -4px; border-radius: 50%; font-size: 22px; line-height: 1; color: #fff; background: #f0624f; box-shadow: 0 3px 0 #b8402f; animation: alert-pop 0.35s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
@keyframes alert-pop { from { transform: translate(-50%, -100%) scale(0.2); } to { transform: translate(-50%, -100%) scale(1); } }
.float-fx { position: absolute; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap; font-family: var(--hand); font-weight: 700; animation: float-up 0.9s ease-out forwards; }
.float-fx.dmg { font-size: 24px; color: #fff; text-shadow: 0 2px 0 #c44a3a, 0 0 4px #c44a3a, 0 0 2px #7a2a20; }
.float-fx.hurt { font-size: 20px; color: #fff; text-shadow: 0 2px 0 #7a2a20, 0 0 4px #c44a3a; }
.float-fx.note { font-size: 30px; color: #ffe57a; text-shadow: 0 2px 0 #8a6a10, 0 0 6px #fff3b0; animation-duration: 1.4s; }
.float-fx.drop { padding: 2px 12px 4px; font-size: 17px; color: var(--ink); background: var(--butter); border-radius: 999px; box-shadow: 0 3px 0 var(--yellow-deep); animation-duration: 1.3s; }
@keyframes float-up { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; margin-top: -6px; } 70% { opacity: 1; } 100% { opacity: 0; margin-top: -46px; } }
/* 풀 뽑기 · 열매 따기 · 토벌 결과: 위 알림 줄 대신 그 자리에서 톡 튄다. 깔끔하게는 노란 글씨가 반짝이며 통통, 끊어지면 회청색 글씨가 흔들리며 가라앉고,
   진행(한 번 더 · 3 / 6)과 요령은 작은 종이 말풍선 */
.float-fx.clean { font-size: 38px; color: #ffe066; text-shadow: 3px 0 0 #8a5a1e, -3px 0 0 #8a5a1e, 0 3px 0 #8a5a1e, 0 -3px 0 #8a5a1e, 2px 2px 0 #8a5a1e, -2px 2px 0 #8a5a1e, 2px -2px 0 #8a5a1e, -2px -2px 0 #8a5a1e, 0 6px 0 #c9852a;
  animation: pop-clean 1.2s cubic-bezier(0.2, 1.4, 0.4, 1) forwards; }
.float-fx.clean::before, .float-fx.clean::after { content: "✦"; position: absolute; color: #ffd84a; text-shadow: 0 0 6px #fff3b0; animation: fx-twinkle 0.35s ease-in-out infinite alternate; }
.float-fx.clean::before { left: -26px; top: -10px; font-size: 24px; }
.float-fx.clean::after { right: -22px; top: 8px; font-size: 17px; animation-delay: 0.15s; }
.float-fx.snap { font-size: 26px; color: #eef3ff; text-shadow: 2px 0 0 #4a5470, -2px 0 0 #4a5470, 0 2px 0 #4a5470, 0 -2px 0 #4a5470, 2px 2px 0 #4a5470, -2px 2px 0 #4a5470, 0 4px 0 #6b7a99; animation: pop-snap 1.1s ease-out forwards; }
/* 열매 따기: 딴 것 그림 + '+1'(일감이면 3 / 6)이 반짝이며 통통(풀 뽑기 '깔끔!'과 같은 움직임, 열매 빛깔 글씨) */
.float-fx.pick { display: flex; align-items: center; gap: 2px; font-size: 32px; color: #fff1f3; text-shadow: 3px 0 0 #a8303f, -3px 0 0 #a8303f, 0 3px 0 #a8303f, 0 -3px 0 #a8303f, 2px 2px 0 #a8303f, -2px 2px 0 #a8303f, 2px -2px 0 #a8303f, -2px -2px 0 #a8303f, 0 5px 0 #d9566a;
  animation: pop-clean 1.2s cubic-bezier(0.2, 1.4, 0.4, 1) forwards; }
.float-fx.pick .fx-ico { display: block; width: 40px; height: 40px; filter: drop-shadow(0 2px 0 rgba(84, 62, 38, 0.3)); }
.float-fx.pick .fx-ico svg { width: 100%; height: 100%; display: block; }
.float-fx.pick::after { content: "✦"; position: absolute; right: -16px; top: -6px; font-size: 18px; color: #ffd84a; text-shadow: 0 0 6px #fff3b0; animation: fx-twinkle 0.35s ease-in-out infinite alternate; }
.float-fx.tip { padding: 2px 12px 4px; font-size: 17px; color: var(--ink); background: var(--paper); border-radius: 999px; box-shadow: 0 3px 0 var(--shadow); animation: float-up 1.3s ease-out forwards; }
@keyframes pop-clean { 0% { opacity: 0; scale: 0.3; margin-top: 10px; } 18% { opacity: 1; scale: 1.18; margin-top: -10px; } 32% { scale: 1; } 75% { opacity: 1; margin-top: -20px; } 100% { opacity: 0; scale: 1; margin-top: -36px; } }
@keyframes pop-snap { 0% { opacity: 0; margin-top: -12px; } 15% { opacity: 1; margin-top: 0; rotate: -5deg; } 30% { rotate: 4deg; } 45% { rotate: -2deg; } 60% { rotate: 0deg; } 80% { opacity: 1; } 100% { opacity: 0; margin-top: 16px; } }
@keyframes fx-twinkle { to { opacity: 0.35; scale: 0.6; } }
.hurt-fx { position: absolute; inset: 0; pointer-events: none !important; opacity: 0; box-shadow: inset 0 0 70px 18px rgba(240, 70, 60, 0.75); }
.hurt-fx.on { animation: hurt-flash 0.55s ease-out; }
@keyframes hurt-flash { 0% { opacity: 1; } 100% { opacity: 0; } }
.curtain { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 20px; pointer-events: none !important; opacity: 0; transition: opacity 0.9s ease; background: #241c26; color: #f3e6d8; font-family: var(--hand); font-size: 26px; text-align: center; }
.curtain.on { opacity: 1; pointer-events: auto !important; }
@media (prefers-reduced-motion: reduce) { .float-fx, .world-label.alert, .hurt-fx.on { animation-duration: 0.01s; } }
.job-ico, .drop-ico { flex: 0 0 auto; display: inline-block; }
.job-ico { width: 46px; height: 46px; border-radius: 14px; background: var(--paper); box-shadow: 0 2px 0 var(--shadow); }
.job-ico svg, .drop-ico svg, .mon-ico svg { width: 100%; height: 100%; display: block; }
.panel .row.mon-card { align-items: flex-start; justify-content: flex-start; gap: 10px; }
.mon-ico { flex: 0 0 auto; width: 60px; height: 60px; border-radius: 16px; background: var(--paper); box-shadow: 0 2px 0 var(--shadow); }
.mon-card.unseen .mon-ico { filter: saturate(0.35) opacity(0.75); }
.mon-card .t { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.mon-card .mon-drop { display: flex; align-items: center; gap: 4px; }
.drop-ico { width: 26px; height: 26px; }
/* 토벌 안내서: 규칙 카드 넷(그림 + 굵은 한 줄 + 짧은 한 줄) */
.rule-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.rule-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px 11px; border-radius: 18px 20px 18px 16px; background: var(--butter); }
.rule-ico { flex: 0 0 auto; width: 48px; height: 48px; }
.rule-ico svg, .lic-ico svg, .chip .ico svg, .facts .ico svg, .lic-badge .ico svg { display: block; width: 100%; height: 100%; }
.rule-card b { display: block; font-size: 19px; line-height: 1.2; }
.rule-card span { display: block; margin-top: 2px; font-size: 16px; line-height: 1.3; color: var(--ink-soft); }
.rule-card span:empty { display: none; }
@media (max-width: 560px) { .rule-grid { grid-template-columns: 1fr; } }
/* 몬스터 카드: 설명 대신 알약 꼬리표(사는 곳 · 단단함 · 공격 · 전리품) */
.mon-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 11px 4px 7px; border-radius: 999px; background: var(--paper); box-shadow: 0 1px 0 var(--shadow); font-size: 16px; line-height: 1.2; white-space: nowrap; }
.chip .ico { flex: 0 0 auto; width: 18px; height: 18px; }
.chip.drop .ico { width: 22px; height: 22px; margin: -2px 0; }
.chip.drop b { font-weight: inherit; color: #b0612a; }
.chip.muted { color: var(--ink-soft); white-space: normal; }
.chip.region.fields { background: #fdeeb5; } .chip.region.forest { background: #d8eecb; } .chip.region.river { background: #d6ebf8; }
.chip.region.mountain { background: #e8e1d3; } .chip.region.night { background: #e3daf5; } .chip.region.boss { background: #f8d0ca; }
.chip.atk-chip { background: #ffe1d8; font-weight: 700; color: #a8452f; }
/* 구역 머리글(카드 셋씩 묶는다) */
.mon-region { display: flex; align-items: center; gap: 6px; margin: 14px 0 6px; padding: 6px 14px 7px 10px; border-radius: 999px; width: fit-content; font-size: 18px; }
.mon-region .ico { width: 20px; height: 20px; }
.mon-region .ico svg { display: block; width: 100%; height: 100%; }
.mon-region.fields { background: #fdeeb5; } .mon-region.forest { background: #d8eecb; } .mon-region.river { background: #d6ebf8; }
.mon-region.mountain { background: #e8e1d3; } .mon-region.night { background: #e3daf5; } .mon-region.boss { background: #f8d0ca; }
.tough { display: inline-flex; gap: 2px; margin-left: 1px; }
.tough i { width: 8px; height: 12px; border-radius: 3px 3px 5px 5px; background: #ddd3c0; }
.tough i.on { background: #6f8fb5; }
/* 검정소: 자격 카드(이름 · 상태 버튼, 아래에 아이콘 한 줄씩) */
.panel .row.lic { display: block; }
.lic-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.lic-top > :nth-child(2) { flex: 1 1 130px; min-width: 0; }
.lic-top .btn, .lic-top .lic-badge { flex: 0 0 auto; margin-left: auto; }
/* 시험 보기 밑에 버튼을 하나 더(슈퍼 알바이터: 레시피 북 보기) — 두 버튼을 같은 폭으로 세로로 */
.lic-side { flex: 0 0 auto; display: flex; flex-direction: column; align-items: stretch; gap: 6px; margin-left: auto; }
.lic-top .lic-side .btn { margin-left: 0; display: inline-flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
/* 지금 읽어야 할 공부거리(대장 갑옷 씨가 "안내서부터 읽어라" 한 단계): 노란 바탕 · 반짝이는 테두리 · 왼쪽 위 '여기!' 딱지 */
.panel .row.hl { position: relative; margin-top: 18px; background: var(--butter); box-shadow: 0 0 0 3px var(--yellow-deep); animation: hl-glow 1.2s ease-in-out infinite alternate; }
.hl-tag { position: absolute; left: 14px; top: -14px; padding: 0 12px 2px; border-radius: 999px; background: #e0524f; color: #fff; font-size: 16px; rotate: -4deg; box-shadow: 0 2px 0 #a8433a;
  animation: hl-bob 0.9s ease-in-out infinite alternate; }
@keyframes hl-glow { to { box-shadow: 0 0 0 3px var(--yellow-deep), 0 0 0 9px rgba(252, 217, 91, 0.45); } }
@keyframes hl-bob { to { translate: 0 -3px; } }
@media (prefers-reduced-motion: reduce) { .panel .row.hl, .hl-tag { animation: none; } }
.lic-ico { flex: 0 0 auto; width: 46px; height: 46px; padding: 4px; border-radius: 14px; background: var(--paper); box-shadow: 0 2px 0 var(--shadow); }
.facts { display: grid; gap: 5px; margin: 8px 0 0; padding: 0 0 0 56px; list-style: none; }
.facts li { display: flex; align-items: flex-start; gap: 8px; font-size: 18px; line-height: 1.3; color: var(--ink-soft); }
.facts .ico { flex: 0 0 auto; width: 22px; height: 22px; margin-top: 1px; }
.lic-badge { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px 5px 8px; border-radius: 999px; background: var(--paper); font-size: 16px; white-space: nowrap; }
.lic-badge .ico { width: 20px; height: 20px; }
.lic-badge.done { background: #d6f0dc; color: #2f6b45; }
.lic-badge.going { background: #ffe1c2; color: #9a5a1a; padding-left: 12px; }
.xp-bar { display: block; width: min(220px, 100%); height: 8px; margin-top: 5px; border-radius: 999px; background: var(--paper-3); overflow: hidden; }
.xp-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(#ffd77a, #f2a65a); }
@media (max-width: 560px) {
  .facts { padding-left: 4px; } .facts li { font-size: 17px; }
  .mon-chips .chip { font-size: 14px; padding: 2px 9px 3px 6px; } .mon-chips { gap: 5px; }
  .panel .row.mon-card .mon-ico { width: 50px; height: 50px; }
}
.panel .t .power { margin-left: 8px; font-size: 14px; color: #d98a2b; letter-spacing: 1px; }
.app.monsters .app-ico { background: #a58bd0; }
/* 마을폰 친구 앱: 하트 줄 · 다음 하트까지 · 오늘 한 일 꼬리표 */
.app.friends .app-ico { background: #ee7489; }
.panel .row.f-card { justify-content: flex-start; align-items: flex-start; gap: 10px; }
.panel .row.f-card > div { flex: 1 1 auto; min-width: 0; }
.f-card .t { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.f-hearts { display: inline-flex; gap: 1px; }
.f-heart { width: 20px; height: 20px; }
.f-heart svg { display: block; width: 100%; height: 100%; fill: #e6d9c4; }
.f-heart.on svg { fill: #f06a8f; }
.f-next { display: flex; align-items: center; gap: 8px; margin-top: 3px; font-size: 15px; color: var(--ink-soft); white-space: nowrap; }
/* 친구 앱: 오늘 마을 소식 · 지금 하는 일 */
.news-list { list-style: none; margin: 0 0 4px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.news-list li { display: flex; align-items: center; gap: 8px; padding: 6px 12px 7px 8px; border-radius: 16px; background: var(--paper-soft); font-size: 16px; line-height: 1.3; }
.n-faces { display: flex; flex: 0 0 auto; padding-right: 6px; }
.n-face { display: grid; place-items: center; width: 30px; height: 30px; margin-right: -8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #f3d9a8; overflow: hidden; }
.n-face svg { width: 32px; height: 32px; }
.n-text { flex: 1 1 auto; min-width: 0; word-break: keep-all; }
.n-time { flex: 0 0 auto; font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.f-now { display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; padding: 2px 11px 3px 6px; border-radius: 999px; background: #eaf5ff; color: #3d6a8f; font-size: 15px; }
.f-now-ico { width: 20px; height: 20px; flex: 0 0 auto; }
.f-now-ico svg { display: block; width: 100%; height: 100%; }
.chip-lab { align-self: center; font-size: 14px; color: var(--ink-soft); }
.f-next .q-bar { display: block; flex: 0 1 110px; margin: 0; }
.f-card.new .q-face { filter: grayscale(0.6); opacity: 0.8; }
.chip.done { background: #d6f0dc; color: #2f6b45; }
.chip.todo { color: var(--ink-soft); background: transparent; box-shadow: inset 0 0 0 1.5px var(--paper-3); }
.chip.gift { background: #ffe3ec; }
.chip.debt { background: #ffe1c2; }
.phone .chip { font-size: 14px; }

/* ---------- 퀘스트(5단계): 머리 위 ! · ?, 왼쪽 위 퀘스트 쪽지, 퀘스트 앱 ---------- */
.world-label.qmark { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; margin-top: -10px; border-radius: 50%; font-size: 25px; line-height: 1; color: var(--ink); background: var(--yellow); box-shadow: 0 3px 0 var(--yellow-deep), 0 0 0 3px #fff; animation: q-bob 0.9s ease-in-out infinite alternate; }
.world-label.qmark.report { color: #fff; background: #6fb4e8; box-shadow: 0 3px 0 #3f86bf, 0 0 0 3px #fff; }
/* 사이드스토리 이야기 표시: ! 대신 연보라 동그라미 속 펼친 책 */
.world-label.qmark.story { width: 38px; height: 38px; background: #f4dcf8; box-shadow: 0 3px 0 #c79ad6, 0 0 0 3px #fff, 0 0 14px rgba(199, 154, 214, 0.75); }
.world-label.qmark.story svg { width: 25px; height: 25px; }
.hud-quest.side i { color: #fff; background: #a978c4; }
.panel .row.q-card .weed-count.side { background: #f4dcf8; color: #6e3f86; }
/* 우사기 클럽 박자 맞추기: 아래쪽 가운데 줄(도토리가 오른쪽에서 동그라미로) */
.rhythm { position: absolute; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 12; width: min(560px, calc(100% - 32px)); transform: translateX(-50%); font-family: var(--hand); color: #fff; text-align: center; pointer-events: none; transition: opacity 0.5s ease; }
.rhythm.done { opacity: 0; }
.rhythm .rh-hype { display: flex; align-items: center; gap: 8px; margin: 0 auto 8px; width: min(320px, 80%); font-size: 14px; text-shadow: 0 2px 0 #3a1f52; }
.rhythm .rh-hype b { white-space: nowrap; font-weight: 700; }
.rhythm .rh-hype i { flex: 1; height: 12px; padding: 2px; border-radius: 999px; background: rgba(30, 14, 48, 0.7); box-shadow: 0 0 0 2px #fff; }
.rhythm .rh-hype u { display: block; height: 100%; width: 30%; border-radius: 999px; background: linear-gradient(90deg, #ff7ad9, #ffe45f); transition: width 0.15s ease-out; }
.rhythm .rh-lane { position: relative; height: 74px; border-radius: 999px; background: rgba(30, 14, 48, 0.72); box-shadow: 0 0 0 3px #fff, 0 0 22px rgba(255, 122, 217, 0.55); overflow: hidden; pointer-events: auto; touch-action: manipulation; cursor: pointer; }
.rhythm .rh-ring { position: absolute; left: 10px; top: 8px; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 4px #ffe45f, inset 0 0 0 3px rgba(255, 255, 255, 0.35); }
.rhythm .rh-ring svg { width: 30px; height: 30px; opacity: 0.35; }
.rhythm .rh-ring.hit { animation: rh-ring 0.25s ease-out; }
@keyframes rh-ring { from { transform: scale(1.25); box-shadow: 0 0 0 6px #fff, 0 0 26px #ffe45f; } }
.rhythm .rh-notes { position: absolute; inset: 0; }
.rhythm .rh-note { position: absolute; left: 0; top: 15px; width: 44px; height: 44px; margin-left: 17px; will-change: transform; }
.rhythm .rh-note svg { width: 44px; height: 44px; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.25)); }
.rhythm .rh-note.hit { opacity: 0 !important; transition: opacity 0.18s ease; }
.rhythm .rh-judge { position: absolute; left: 0; right: 0; bottom: 132px; font-size: 30px; font-weight: 700; text-shadow: 0 3px 0 #3a1f52, 0 0 12px rgba(0, 0, 0, 0.4); opacity: 0; }
.rhythm .rh-judge.pop { animation: rh-pop 0.55s ease-out; }
.rhythm .rh-judge.perfect { color: #ffe45f; }
.rhythm .rh-judge.good { color: #8cff7a; }
.rhythm .rh-judge.miss { color: #c9c0d8; }
@keyframes rh-pop { 0% { opacity: 0; transform: translateY(8px) scale(0.8); } 25% { opacity: 1; transform: translateY(0) scale(1.15); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
.rhythm .rh-count { position: absolute; left: 0; right: 0; bottom: 176px; font-size: 54px; font-weight: 700; color: #fff; text-shadow: 0 4px 0 #3a1f52; }
.rhythm .rh-count.go { color: #ff9ae3; }
.rhythm .rh-combo { position: absolute; right: 18px; bottom: 82px; font-size: 18px; color: #ffe45f; text-shadow: 0 2px 0 #3a1f52; }
.rhythm .rh-hint { margin-top: 8px; font-size: 14px; text-shadow: 0 2px 0 #3a1f52; }
.rhythm .rh-hint kbd { padding: 0 6px 1px; border-radius: 6px; font-family: var(--hand); color: var(--ink); background: var(--paper); }
[data-input="touch"] .rhythm .rh-hint kbd { display: none; }
@media (prefers-reduced-motion: reduce) { .rhythm .rh-judge.pop, .rhythm .rh-ring.hit { animation-duration: 0.01s; } }
/* 섬 편 놀이(연타 · 타이밍): 박자 화면처럼 화면 아래 가운데. 시네마틱 화면에서도 보인다 */
.minigame { position: absolute; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 12; width: min(460px, calc(100% - 32px)); transform: translateX(-50%); font-family: var(--hand); color: #fff; text-align: center; transition: opacity 0.4s ease; }
.minigame.done { opacity: 0; }
.minigame .mg-lab { margin-bottom: 8px; font-size: 18px; text-shadow: 0 2px 0 #1f3550, 0 0 10px rgba(0, 0, 0, 0.35); }
.minigame .mg-track { position: relative; height: 22px; border-radius: 999px; background: rgba(20, 34, 52, 0.72); box-shadow: 0 0 0 3px #fff; overflow: hidden; }
.minigame .mg-zone { position: absolute; top: 0; bottom: 0; background: #8cd86a; }
.minigame .mg-fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #7fd0ff, #ffe45f); }
.minigame.timing .mg-fill, .minigame.mash .mg-needle { display: none; }
.minigame .mg-needle { position: absolute; top: 0; bottom: 0; width: 6px; margin-left: -3px; border-radius: 3px; background: #fff; box-shadow: 0 0 0 2px #1f3550; }
.minigame .mg-pips { display: flex; justify-content: center; gap: 6px; height: 14px; margin-top: 8px; }
.minigame .mg-pips i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); box-shadow: inset 0 0 0 2px #fff; }
.minigame .mg-pips i.on { background: #ffe45f; }
.minigame .mg-judge { position: absolute; left: 0; right: 0; bottom: 150px; font-size: 28px; font-weight: 700; opacity: 0; text-shadow: 0 3px 0 #1f3550; }
.minigame .mg-judge.pop { animation: rh-pop 0.55s ease-out; }
.minigame .mg-judge.good { color: #8cff7a; }
.minigame .mg-judge.miss { color: #c9c0d8; }
.minigame .mg-btn { margin-top: 10px; min-width: 150px; padding: 12px 26px; border-radius: 999px; font-size: 22px; color: var(--ink); background: var(--paper); box-shadow: 0 4px 0 #b9a27c, 0 0 0 3px #fff; touch-action: manipulation; }
.minigame .mg-btn.hit { animation: mg-hit 0.15s ease-out; }
@keyframes mg-hit { 50% { transform: scale(0.92); } }
.minigame .mg-hint { margin-top: 6px; font-size: 13px; text-shadow: 0 2px 0 #1f3550; }
.minigame .mg-hint kbd { padding: 0 6px 1px; border-radius: 6px; font-family: var(--hand); color: var(--ink); background: var(--paper); }
[data-input="touch"] .minigame .mg-hint { display: none; }
@media (prefers-reduced-motion: reduce) { .minigame .mg-judge.pop, .minigame .mg-btn.hit { animation-duration: 0.01s; } }
/* 섬에서 직접 걸을 때(축제 · 밤의 정글 · 동굴 구출): 터치면 조이스틱 · 행동 버튼, 그리고 목표 글을 보인다(다른 HUD 는 숨긴 채) */
[data-input="touch"] .cinematic.in-roam .hud-action:not([hidden]) { display: block !important; }
[data-input="touch"] .cinematic.in-roam .stick:not([hidden]) { display: block !important; }
.cinematic.in-roam .hud-timer:not([hidden]) { display: flex !important; }
@keyframes q-bob { from { margin-top: -10px; } to { margin-top: -18px; } }
@media (prefers-reduced-motion: reduce) { .world-label.qmark { animation: none; } }
.hud-quest { display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 0 8px; max-width: min(380px, 70vw); padding: 5px 16px 7px 10px; border-radius: 18px 20px 18px 16px; background: #fff6dc; box-shadow: 0 3px 0 #e8c97a; font-size: 16px; line-height: 1.25; }
.hud-quest i { grid-row: span 2; align-self: center; padding: 1px 8px 2px; border-radius: 999px; font-style: normal; font-size: 13px; color: #8a5a10; background: #ffd77a; }
.hud-quest.story i { color: #fff; background: #c0473c; }
.hud-quest b { font-size: 16px; }
.hud-quest > span { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; color: var(--ink-soft); font-size: 15px; }
.hud-quest em { font-style: normal; }
.hud-quest small { padding: 0 8px 1px; border-radius: 999px; background: #ffe7a6; color: #8a5a10; font-size: inherit; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hud-quests { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.hud-quest, .toast { word-break: keep-all; } /* 한국어는 낱말 단위로 줄바꿈 */
.hud-quest .q-chips { display: inline-flex; flex-wrap: wrap; gap: 4px 6px; }
.hud-quest .q-chip { display: inline-flex; align-items: center; gap: 2px; padding: 0 9px 1px 3px; border-radius: 999px; background: #ffe7a6; color: #8a5a10; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hud-quest .q-chip svg { width: 24px; height: 24px; margin: -4px 0; flex: 0 0 auto; }
.hud-quest .q-chip.done { background: #c9eccf; color: #2f6b3c; }
.hud-quests:empty { display: none; }
/* 좁은 화면: 꼬리표(부탁 · 이야기)를 제목 위로 올려 글이 넓게 들어가게 */
@media (max-width: 560px) {
  .hud-quest { grid-template-columns: 1fr; padding: 4px 12px 6px 10px; }
  .hud-quest i { grid-row: auto; justify-self: start; padding: 0 7px 1px; font-size: 12px; }
  .hud-quest b { font-size: 15px; }
  .hud-quest > span { font-size: 14px; }
}
.panel .t .power { white-space: nowrap; }
.hud-quest.got { animation: q-got 1.2s ease-out; }
/* 새 부탁 쪽지가 날아와 꽂힐 때: 쪽지는 그때까지 숨어 있다가 톡 튀며 반짝(빛이 쓸고 지나가고 별이 튄다) */
.hud-quest, .guide-goal { position: relative; transform-origin: left center; }
.hud-quest.incoming, .guide-goal.incoming { visibility: hidden; }
.hud-quest.shine, .guide-goal.shine { animation: q-shine 1.4s ease-out; }
@keyframes q-shine {
  0% { scale: 1.25; background: #fff0a6; box-shadow: 0 0 0 9px rgba(255, 215, 122, 0.75), 0 3px 0 #e8c97a; }
  25% { scale: 0.95; }
  45% { scale: 1.06; background: #fff3c4; box-shadow: 0 0 0 5px rgba(255, 215, 122, 0.45), 0 3px 0 #e8c97a; }
  100% { scale: 1; }
}
.hud-quest.shine::after, .guide-goal.shine::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.95) 48%, transparent 62%) no-repeat; background-size: 260% 100%; animation: q-sweep 0.8s 0.12s ease-out both; }
@keyframes q-sweep { from { background-position: 140% 0; } to { background-position: -70% 0; } }
.q-star { position: absolute; left: var(--x); top: var(--y); width: 20px; height: 20px; margin: -10px 0 0 -10px; color: var(--c); pointer-events: none; filter: drop-shadow(0 1px 0 rgba(160, 110, 20, 0.45)); animation: q-star 0.95s var(--t) ease-out both; }
.q-star svg { display: block; width: 100%; height: 100%; }
@keyframes q-star {
  0% { transform: scale(0) rotate(0deg); opacity: 1; }
  45% { transform: translate(var(--dx), var(--dy)) scale(1.15) rotate(60deg); opacity: 1; }
  100% { transform: translate(calc(var(--dx) * 1.5), calc(var(--dy) * 1.5)) scale(0.3) rotate(140deg); opacity: 0; }
}
.task-card.quest .task-txt i { background: #ffd77a; box-shadow: 0 2px 0 #e0b04a; }
/* 하치와레 안내의 할 일 카드: 왼쪽 위 할 일 쪽지의 표(노란 바탕 흰 글씨)처럼 */
.task-card.goal .task-txt i { background: var(--yellow-deep); color: #fff; box-shadow: 0 2px 0 #c98f2e; }
@media (prefers-reduced-motion: reduce) { .hud-quest.shine, .hud-quest.shine::after, .guide-goal.shine, .guide-goal.shine::after, .q-star { animation: none; } .q-star { display: none; } }
@keyframes q-got { 0% { transform: scale(1.08); box-shadow: 0 3px 0 #e8c97a, 0 0 0 6px rgba(255, 215, 122, 0.8); } 100% { transform: none; } }
.cinematic .hud-quest, .cinematic .hud-job { display: none !important; }
/* 가방 버튼: 타이틀 · 마을 입장 연출 중에는 숨기고, 집 · 친구 집 안에서는 그대로 */
.cinematic:not(.in-home) .hud-bag { display: none !important; }
.app.quests .app-ico { background: #e8a83e; }
.panel .row.q-card { justify-content: flex-start; align-items: flex-start; gap: 10px; }
.panel .row.q-card > div { flex: 1 1 auto; min-width: 0; }
.panel .row.q-card > .btn { align-self: center; }
.panel .row.q-card.tracked { background: var(--butter); box-shadow: inset 0 0 0 3px var(--yellow-deep); }
.panel .row.q-card.story .weed-count { background: #f6c3bd; color: #8a2f25; }
.panel .row.q-card.locked, .panel .row.q-card.done { opacity: 0.75; }
.q-face { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 16px; background: var(--paper); box-shadow: 0 2px 0 var(--shadow); overflow: hidden; }
.q-face svg { width: 100%; height: 100%; display: block; }
.q-face.mono { font-size: 24px; font-weight: 700; color: var(--ink); background: var(--tag); }
.q-card.locked .q-face { filter: grayscale(0.8); }
.q-bar { height: 10px; margin-top: 5px; padding: 2px; border-radius: 999px; background: var(--paper-3); }
.q-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(#ffd77a, #f2a65a); }
/* PC: 왼쪽 위 퀘스트 쪽지를 크게 */
[data-input="desk"] .hud-quest { max-width: min(520px, 46vw); gap: 2px 10px; padding: 7px 20px 9px 12px; }
[data-input="desk"] .hud-quest i { padding: 2px 10px 3px; font-size: 16px; }
[data-input="desk"] .hud-quest b { font-size: 20px; }
[data-input="desk"] .hud-quest > span { font-size: 18px; }

/* ---------- 주머니(동물의 숲처럼): 동그란 칸 · 개수 · 이름 말풍선 · 할 일 메뉴 ---------- */
.panel-bag { width: min(760px, 100%); --tab: #f6c453; }
.panel-exam { width: min(640px, 100%); }
/* 값 버튼: 동전 그림 + 값 */
.price-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: 0 0 auto; white-space: nowrap; }
.price-btn .coin-ico { width: 22px; height: 22px; }
.price-btn .coin-ico svg { display: block; width: 100%; height: 100%; }
.price-btn:disabled .coin-ico { filter: grayscale(0.8); opacity: 0.6; }
.panel .row > .lic-badge { flex: 0 0 auto; }
.chip-btn { cursor: pointer; border: 0; color: var(--ink-soft); background: #fff; font: inherit; font-size: 15px; }
.chip-btn:hover { background: var(--butter); }
.panel .row.q-card > div { flex: 1 1 auto; min-width: 0; }
.panel-guidebook { width: min(700px, 100%); }
/* 맥주집 */
.panel-pub { --tab: #f2a65a; }
.panel .row.pub-row { justify-content: flex-start; gap: 12px; }
.panel .row.pub-row > div:not(.q-face) { flex: 1 1 auto; min-width: 0; }
.panel .row.pub-row .btn, .panel .row.pub-row .lic-badge { flex: 0 0 auto; }
.panel .row.pub-row.cheers { background: #fde3c8; }
.panel .row.pub-row.cheers.here { box-shadow: inset 0 0 0 3px #f2a65a; }
.pocket { position: relative; margin-top: 10px; padding: 18px 16px 20px; border-radius: 30px 34px 30px 28px;
  background: radial-gradient(circle at 12px 12px, rgba(255, 255, 255, 0.55) 2px, transparent 2.5px) 0 0 / 22px 22px, linear-gradient(#fbe7a8, #f6d98b);
  box-shadow: inset 0 0 0 4px #fff3cf, 0 4px 0 #e2bd62; }
.pocket-grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 10px 8px; }
.pocket-slot { position: relative; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fffaf0 0 58%, #f5e8c6 72%); box-shadow: inset 0 -3px 0 rgba(160, 120, 50, 0.18), 0 2px 0 rgba(150, 110, 40, 0.25);
  display: flex; align-items: center; justify-content: center; transition: transform 0.12s; }
.pocket-slot.empty { background: rgba(255, 248, 225, 0.55); box-shadow: inset 0 2px 3px rgba(150, 110, 40, 0.18); }
.pocket-ico { width: 86%; height: 86%; pointer-events: none; }
.pocket-ico svg { width: 100%; height: 100%; display: block; }
button.pocket-slot:hover { transform: translateY(-2px); }
.pocket-slot.on { transform: translateY(-4px) scale(1.08); box-shadow: 0 0 0 4px #fff, 0 0 0 7px #ffb84d, 0 6px 0 rgba(150, 110, 40, 0.3); animation: slot-bob 0.9s ease-in-out infinite alternate; z-index: 1; }
@keyframes slot-bob { from { translate: 0 0; } to { translate: 0 -3px; } }
.pocket-cnt { position: absolute; right: -3px; bottom: -3px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 999px; background: #6b4f33; color: #fff; font-size: 14px; line-height: 22px; text-align: center; box-shadow: 0 0 0 2px #fff6dc; }
.pocket-held { position: absolute; left: -4px; top: -6px; font-style: normal; font-size: 18px; filter: drop-shadow(0 1px 0 #fff); }
.pocket-slot.held { box-shadow: inset 0 0 0 3px #8fd3a8, 0 2px 0 rgba(150, 110, 40, 0.25); }
.pocket-name { position: absolute; z-index: 5; transform: translate(-50%, -100%); padding: 3px 14px 5px; border-radius: 999px; background: #6b4f33; color: #fff; font-size: 17px; white-space: nowrap; pointer-events: none; animation: pop 0.2s cubic-bezier(0.2, 1.6, 0.4, 1); }
.pocket-name::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-top-color: #6b4f33; border-bottom: 0; }
.pocket-menu { position: absolute; z-index: 4; display: flex; flex-direction: column; gap: 2px; min-width: 150px; padding: 8px; border-radius: 20px 22px 20px 18px; background: #fffdf6; box-shadow: 0 0 0 3px #f2dfae, 0 6px 16px rgba(84, 62, 38, 0.25); animation: pop 0.2s cubic-bezier(0.2, 1.6, 0.4, 1); }
.pocket-act { padding: 6px 14px 8px; border-radius: 14px; text-align: left; font-size: 18px; white-space: nowrap; }
.pocket-act:hover:not(:disabled), .pocket-act:focus-visible { background: #fff1c2; outline: none; }
.pocket-act.main { color: #b0612a; }
.pocket-act:disabled { color: #b9a78a; cursor: default; }
.pocket-name.hover { z-index: 6; background: #8a6a48; animation-duration: 0.14s; }
.pocket-name.hover::after { border-top-color: #8a6a48; }
.pocket-empty { position: absolute; left: 0; right: 0; top: 50%; margin: 0; transform: translateY(-50%); text-align: center; font-size: 20px; color: #a8854a; pointer-events: none; }
@media (max-width: 640px) { .pocket-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } .pocket { padding: 14px 12px 16px; } }
@media (prefers-reduced-motion: reduce) { .pocket-slot.on, .pocket-name, .pocket-menu { animation: none; } }

/* 마을폰 설정 앱: 켜고 끄는 스위치 */
.app.options .app-ico { background: #9aa3b5; }
.panel .row.opt-row { gap: 10px; }
.switch { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 12px 4px 4px; border-radius: 999px; background: #e3d9c2; font-size: 16px; color: var(--ink-soft); }
.switch i { position: relative; width: 52px; height: 30px; border-radius: 999px; background: #cfc3a6; transition: background 0.15s; }
.switch i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 rgba(84, 62, 38, 0.2); transition: transform 0.15s; }
.switch.on { background: #d6f0dc; color: #2f6b45; }
.switch.on i { background: var(--mint-deep); }
.switch.on i::after { transform: translateX(22px); }

/* ---------- 휴대폰 화면 다듬기 ----------
   홈 화면 앱(전체화면)에서는 노치 · 홈 막대를 HUD 가 env(safe-area-inset-*) 로 직접 비켜 가므로 문서 바깥 여백은 뺀다(겹치면 위아래에 빈 띠가 생긴다).
   큰 카드(노동 완료 · 새 일감)는 가운데 기준(left: 50%)이라 폭이 화면 반으로 줄어 글이 세로로 꺾였다 → 글 폭만큼 넓히고 화면 안으로만 제한한다.
   큰 소식 카드가 화면보다 크면 위가 잘려 못 보던 것 → 넘치면 위부터 스크롤, 남으면 가운데. */
:root { padding: 0; }
.hud-banner { width: max-content; max-width: calc(100% - 48px); box-sizing: border-box; }
.task-card { width: max-content; }
.notice-wrap, .raffle-wrap { align-items: flex-start; overflow-y: auto; }
.notice-card, .raffle-stage { margin: auto; }
/* 창 닫기: 오른쪽 위 X(스크롤 밖이라 늘 보인다). 첫 줄(이름표 · 지갑)은 X 와 겹치지 않게 비켜 두고, 닫기만 있던 아래 줄은 감춘다 */
.panel-x { position: absolute; top: 8px; right: 8px; z-index: 3; width: 38px; height: 38px; padding: 0; border-radius: 50%; background: var(--paper-2); box-shadow: 0 3px 0 var(--shadow); }
/* X 는 글자 대신 선 두 개로 그린다: 글꼴마다 × 의 자리가 달라 휴대폰에서 동그라미 가운데에서 벗어났다 */
.panel-x::before, .panel-x::after { content: ""; position: absolute; left: calc(50% - 9px); top: calc(50% - 1.5px); width: 18px; height: 3px; border-radius: 2px; background: var(--ink); transform: rotate(45deg); }
.panel-x::after { transform: rotate(-45deg); }
.panel-x:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.panel-x ~ .panel-body > :first-child { padding-right: 44px; }
.panel .actions:empty { display: none; }
.creator { padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.home-bar { width: min(760px, calc(100% - 24px - env(safe-area-inset-left) - env(safe-area-inset-right))); }
.home-tray { width: min(820px, calc(100% - 24px - env(safe-area-inset-left) - env(safe-area-inset-right))); }
/* 홈 화면 앱(아이폰): 시각 띠 밑까지 그리면 100% 높이가 띠 높이(약 60px)만큼 모자라 화면 아래가 비었다 → 그때는 화면 전체 높이(100vh)로.
   .standalone 은 src/ui/webapp.js 가 붙인다(display-mode 를 모르는 경우 대비) */
@media (display-mode: standalone), (display-mode: fullscreen) { html, body { height: 100vh; } }
html.standalone, html.standalone body { height: 100vh; }

/* 휴대폰(세로 폭 480px 이하 · 가로 높이 500px 이하): 글씨 · 칸 · 버튼을 한 단계 작게, 줄 간격을 촘촘하게(한 화면에 더 많이 → 스크롤 덜) */
@media (max-width: 480px), (max-height: 500px) {
  .hud-left { gap: 5px; }
  .hud-status { gap: 4px 6px; }
  .hud-pill { gap: 6px; padding: 2px 13px 4px 6px; }
  .hud-pill .ico { font-size: 20px; }
  .hud-money { font-size: 19px; }
  .hud-grade { padding: 0 10px 2px; font-size: 14px; }
  .hud-buff { font-size: 13px; }
  .hud-energy { font-size: 15px; }
  .hud-energy .ico { font-size: 17px; }
  .hud-bar { width: 74px; height: 9px; }
  .hud-job, .guide-goal { gap: 6px; padding: 3px 10px 5px 6px; font-size: 15px; }
  .hud-job::before { width: 20px; height: 20px; }
  .guide-goal::before { padding: 0 8px 1px; font-size: 12px; }
  .hud-quest { padding: 3px 12px 5px 8px; }
  .hud-quest b { font-size: 14px; }
  .hud-quest > span { font-size: 13px; }
  .hud-quest .q-chip svg { width: 20px; height: 20px; }
  .hud-party { font-size: 14px; }
  .hud-party .pt-face { width: 28px; height: 28px; }
  .hud-party .pt-face svg { width: 30px; height: 30px; }
  .hud-clock { left: max(14px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom)); }
  .hud-date { gap: 4px; font-size: 15px; }
  .hud-date .ico { font-size: 18px; }
  .hud-time b { font-size: 36px; }
  .hud-time small { font-size: 16px; }
